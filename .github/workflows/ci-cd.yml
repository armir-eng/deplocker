name: Deplocker CI/CD

on:
  push:
    branches:
      - '**'

jobs:
  #---------------------------------------
  # CI: Runs on every push
  #---------------------------------------
  ci:
    name: Build & Test
    runs-on: self-hosted
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-install-ci

      - name: Lint & typecheck frontend
        run: make frontend-lint-ci

      - name: Run frontend tests
        run: make frontend-test-ci

      - name: Lint & typecheck backend
        run: make backend-lint-ci
      
      - name: Run backend tests
        run: make backend-test-ci

      - name: Cleanup
        if: always()
        run: make backend-clean-ci

      - name: Build images
        run: make build-ci FRONTEND_API_URL=${{vars.PROD_API_URL}}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Push images
        run: |
          make publish-ci \
            IMAGE_OWNER=${{github.repository_owner}} \
            IMAGE_SHA=${{github.sha}}

  cd:
    #-----------------------------------------------
    # CD: Runs on every push to the master branch
    #-----------------------------------------------
    name: Deploy to production
    runs-on: self-hosted
    # `needs` is what makes this a gate: without it the job would start in
    # parallel with ci and could deploy a commit whose tests never passed.
    needs: ci
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The runner is the production host, so ci already built deplocker-api
      # and deplocker-ui locally; deploy-cd reuses those images directly.
      # Production secrets are provisioned on the host, never by this workflow.
      - name: Deploy
        run: make deploy-cd
