name: Deplocker API CI/CD

on:
  push:
    branches: [dev, main]

jobs:
  #---------------------------------------
  # CI: Runs on push to dev
  #---------------------------------------
  ci:
    name: Build & Test
    runs-on: self-hosted
    permissions:
      packages: write
      contents: read
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4

      - name: Build image & run tests
        run: |
          docker compose -f docker-compose.test.yml \
            up --build --exit-code-from api --abort-on-container-exit

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.test.yml \
            down -v --remove-orphans

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Push image
        run: |
          # Create the GHCR tags and push them to the registry.
          docker tag deplocker-api:latest ghcr.io/${{github.repository_owner}}/deplocker-api:${{github.sha}}
          docker tag deplocker-api:latest ghcr.io/${{github.repository_owner}}/deplocker-api:latest
          docker push ghcr.io/${{github.repository_owner}}/deplocker-api:${{github.sha}}
          docker push ghcr.io/${{github.repository_owner}}/deplocker-api:latest

          # Remove the GHCR-belonging tags, and keep only the ':latest' one.
          docker rmi ghcr.io/${{github.repository_owner}}/deplocker-api:${{github.sha}}
          docker rmi ghcr.io/${{github.repository_owner}}/deplocker-api:latest

  cd:
    #-----------------------------------------------
    # CD: Runs on every push to the main branch
    #-----------------------------------------------
    name: Deploy to production
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy
        run: |
          docker compose -f docker-compose.prod.yml \
            down --remove-orphans
          docker compose -f docker-compose.prod.yml \
            up -d
