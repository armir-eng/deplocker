[project]
name = "backend"
version = "0.1.0"
description = "Self-hosted deployment platform for containerized applications."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Armir Shehaj", email = "armir.shehaj@gmail.com" }]
dependencies = [
    "fastapi[standard]==0.129.0",
    "pydantic-settings==2.12.0",
    "SQLAlchemy==2.0.46",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "docker==7.1.0",
    "pwdlib[argon2]==0.3.0",
    "PyJWT==2.11.0",
    "celery==5.6.2",
    "Jinja2==3.1.6",
    "oauthlib==3.3.1",
    "slowapi==0.1.9",
    "python-json-logger==4.0.0",
    "redis==7.1.1",
    "anyascii==0.3.3",
]

[dependency-groups]
dev = [
    "Faker==40.4.0",
    "ruff>=0.9.0",
    "pytest==9.0.2",
    "fakeredis==2.34.1",
    "mypy>=2.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "TCH", # type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments (FastAPI Depends)
    "SIM108", # ternary operator — sometimes less readable
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"app/main.py" = ["F401"]
"tests/conftest.py" = ["F401"]
"app/models/*.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "pwdlib.*",
    "pythonjsonlogger.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
