# Development stack for the whole project. The `ui` service sits behind a
# profile, so a bare `docker compose up` brings up the backend only.
#
#   docker compose up                        # backend
#   docker compose --profile frontend up -d  # backend + ui
name: deplocker

services:

  # Backend services
  api:
    build: ./backend
    image: deplocker-api
    container_name: deplocker-api
    pull_policy: never
    env_file: ./backend/.env
    environment:
      # Frontend origin used by the backend for CORS allow_origins and email
      # confirmation links. Pass-through form (no value): forwarded only when set
      # on the host, so `make start-dev` can override it to the Vite dev server
      # (http://localhost:5173). On a bare `up` the key is not injected and the
      # value from ./backend/.env stays in effect.
      - DEV_FRONTEND_URL
    volumes:
      - ./backend:/app
      - /app/.venv   # keep the image's venv; don't let the bind mount above hide it
      # - /opt/deplocker-api:/opt/deplocker-api
    ports:
      - "127.0.0.1:8080:8080"
    command: ["sh", "./scripts/run_app.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:18.1
    container_name: deplocker_postgres
    env_file: ./backend/.env
    ports:
      - "5435:5432"
    volumes:
      - ./backend/scripts/init-scripts:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 20s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: deplocker_rabbitmq
    env_file: ./backend/.env
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis-stack:
    image: redis/redis-stack:latest
    container_name: deplocker_redis
    env_file: ./backend/.env
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: ["sh", "-c", "redis-stack-server --requirepass $$REDIS_PASSWORD"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Frontend service
  ui:
    profiles: ["frontend"]   # not started by a bare `docker compose up`; enable with --profile frontend
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time by Vite
        # This way, the frontend can be served as static files by any web server, without needing a backend to proxy API requests.
        API_URL: http://localhost:8080
    pull_policy: never
    image: deplocker-ui
    container_name: deplocker-ui
    ports:
      - "8082:80"
    restart: always

volumes:
  pgdata:
  rabbitmq_data:
  redis_data: